<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <title>Arrow to the Knee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container header-row">
      <div class="brand">
        <h1 class="title"><bdi dir="ltr">Arrow to the Knee</bdi></h1>
        <p class="subtitle" id="build-name"></p>
        <label class="build-switcher" id="build-switcher-wrap" hidden>
          <span class="visually-hidden">בחירת בילד</span>
          <select id="build-switcher"></select>
        </label>
      </div>
      <div class="header-side">
        <div class="progress" id="progress" aria-live="polite">
          <span class="progress-text" id="progress-text"></span>
          <span class="progress-bar" aria-hidden="true"><span id="progress-fill"></span></span>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="container">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="search" id="search" placeholder="חיפוש בעברית או באנגלית" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="חיפוש">
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="קטגוריות"></nav>
    </div>
  </div>

  <main class="container" id="main">
    <div id="list" aria-live="polite"></div>
    <noscript><p class="empty">האתר דורש JavaScript.</p></noscript>
  </main>

  <footer class="container footer">
    <p>
      התמונות והמידע מתוך
      <a href="https://en.uesp.net/" target="_blank" rel="noopener noreferrer"><bdi>UESP</bdi></a>
      ומתוך
      <a href="https://elderscrolls.fandom.com/" target="_blank" rel="noopener noreferrer"><bdi>The Elder Scrolls Wiki</bdi></a>&nbsp;(<bdi>Fandom</bdi>).
    </p>
    <p>המשחק <bdi>The Elder Scrolls V: Skyrim</bdi> הוא <bdi>© Bethesda</bdi>.</p>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-scroll" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text" id="toast-text"></span>
    <button type="button" class="toast-undo" id="toast-undo">ביטול</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
